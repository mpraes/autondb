name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. v1.2.3)'
        required: true
        type: string

permissions:
  contents: write

env:
  VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}

jobs:
  # ── Step 0: Validate tag and extract changelog ──
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.clean }}
      changelog: ${{ steps.changelog.outputs.body }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          # Strip 'v' prefix if present
          CLEAN="${VERSION#v}"
          echo "clean=$CLEAN" >> "$GITHUB_OUTPUT"

          # Mark as prerelease if version contains alpha/beta/rc
          if echo "$CLEAN" | grep -qE '(alpha|beta|rc|pre)'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract changelog section
        id: changelog
        run: |
          # Try exact version match first, then Unreleased
          SECTION=$(awk -v ver="$CLEAN" '
            BEGIN { hdr = "## [" ver "]" }
            index($0, hdr) == 1 { flag=1; next }
            flag && index($0, "## [") == 1 { exit }
            flag && index($0, "[") == 1 && index($0, "]:") == 1 { exit }
            flag { print }
          ' CHANGELOG.md 2>/dev/null || true)

          if [ -z "$SECTION" ]; then
            SECTION=$(awk -v ver="Unreleased" '
              BEGIN { hdr = "## [" ver "]" }
              index($0, hdr) == 1 { flag=1; next }
              flag && index($0, "## [") == 1 { exit }
              flag && index($0, "[") == 1 && index($0, "]:") == 1 { exit }
              flag { print }
            ' CHANGELOG.md 2>/dev/null || true)
          fi

          # Write to file for multiline output
          echo "$SECTION" > /tmp/changelog_section.md
          echo "body<<EOF" >> "$GITHUB_OUTPUT"
          cat /tmp/changelog_section.md >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Show release metadata
        run: |
          echo "Version: ${{ steps.version.outputs.clean }}"
          echo "Prerelease: ${{ steps.version.outputs.prerelease }}"
          echo "--- Changelog ---"
          cat /tmp/changelog_section.md

  # ── Step 1: Build the Python core binary ONCE per architecture ──
  build-sidecar:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            sidecar_name: autondb-core-x86_64-pc-windows-msvc.exe
            pyinstaller_ext: .exe
            artifact_name: autondb-core-x86_64-pc-windows-msvc.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            sidecar_name: autondb-core-x86_64-unknown-linux-gnu
            pyinstaller_ext: ""
            artifact_name: autondb-core-x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
            sidecar_name: autondb-core-aarch64-apple-darwin
            pyinstaller_ext: ""
            artifact_name: autondb-core-aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
            sidecar_name: autondb-core-x86_64-apple-darwin
            pyinstaller_ext: ""
            artifact_name: autondb-core-x86_64-apple-darwin

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install Python deps
        run: uv sync --group dev

      - name: Build Python core binary
        run: |
          uv run pyinstaller autondb-core.spec --noconfirm --clean
          mkdir -p src-tauri/binaries
          cp dist/autondb-core${{ matrix.pyinstaller_ext }} src-tauri/binaries/${{ matrix.sidecar_name }}
        shell: bash

      - name: Upload sidecar artifact
        uses: actions/upload-artifact@v4
        with:
          name: sidecar-${{ matrix.target }}
          path: src-tauri/binaries/${{ matrix.artifact_name }}
          retention-days: 1

      - name: Upload standalone CLI binary
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: dist/autondb-core${{ matrix.pyinstaller_ext }}
          retention-days: 1

  # ── Step 2: Build Tauri app reusing the pre-built sidecar ──
  build-tauri:
    needs: [prepare, build-sidecar]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            sidecar_name: autondb-core-x86_64-pc-windows-msvc.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            sidecar_name: autondb-core-x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
            sidecar_name: autondb-core-aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
            sidecar_name: autondb-core-x86_64-apple-darwin

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Download pre-built sidecar
        uses: actions/download-artifact@v4
        with:
          name: sidecar-${{ matrix.target }}
          path: src-tauri/binaries/

      - name: Make sidecar executable (Unix)
        if: runner.os != 'Windows'
        run: chmod +x src-tauri/binaries/${{ matrix.sidecar_name }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux system deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Node deps
        run: npm install

      - name: Build Tauri app (reuses same sidecar binary)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.prepare.outputs.version }}
          releaseName: "AutonDB v${{ needs.prepare.outputs.version }}"
          releaseBody: "${{ needs.prepare.outputs.changelog }}"
          releaseDraft: false
          prerelease: ${{ needs.prepare.outputs.prerelease }}

  # ── Step 3: Publish standalone CLI binaries to the Release ──
  publish-cli:
    needs: [prepare, build-sidecar, build-tauri]
    runs-on: ubuntu-latest
    steps:
      - name: Download all CLI binaries
        uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          merge-multiple: true
          path: cli-binaries/

      - name: Upload CLI binaries to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          files: cli-binaries/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Step 4: Publish .deb to GitHub Packages ──
  publish-deb:
    needs: [prepare, build-tauri]
    runs-on: ubuntu-latest
    steps:
      - name: Download .deb artifact
        uses: actions/download-artifact@v4
        with:
          name: autondb_${{ needs.prepare.outputs.version }}_amd64.deb
          path: deb-package/
        continue-on-error: true

      - name: Upload .deb to Release
        if: hashFiles('deb-package/*.deb') != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          files: deb-package/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
